services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      ENABLE_DEMO: 'false'
      PILOT_MODE: 'true'
      HOST: 0.0.0.0
      TRUST_PROXY: '1'
    expose: ['3100']
  https:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public DNS hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
